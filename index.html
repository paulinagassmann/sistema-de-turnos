 <!DOCTYPE html>
 <html lang="es">

 <head>
    <meta charset="UTF-8">
    <meta name="description" content="Acceso al portal de Pausa, centro 
    especializado en salud mental y bienestar emocional.">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
    <title> Pausa - Acceso </title>
    <link rel="stylesheet" href="styles.css"> <!-- Enlaza el archivo styles.css para agregar estilos -->
 </head>

 <body>

    <header>
        <div class="bloque-marca">
            <span class="logo-texto">Pausa</span>
            <span class="subtitulo-logo">Clínica de Salud Mental</span>
        </div>
        <nav>
            <a href=" ">¿No tienes una cuenta?</a>
        </nav>
    </header>

    <main>
        <section>
            <h1> Iniciar sesión en Pausa </h1>
            <p> Ingrese sus credenciales para acceder a su cuenta  </p>

            <form action="paciente.html" method="get"> <!-- Cambié el método a "get" pero dsp hay q cambiarlo -->
                <!--usuario-->
                <div> 
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /></svg>
                <label for="usuario"> Nombre de usuario </label>
                <input type="text" name="usuario" id="usuario" placeholder="Ingrese su usuario" required>
                </div>

                <!--contraseña-->
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-key"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0" /><path d="M15 9h.01" /></svg>
                <label for="password"> Contraseña </label>
                <input type="password" name="password" id="password" placeholder="Ingrese su contraseña" required>
                </div>

                <button type="submit"> Iniciar Sesión </button>
            </form>

            <a href=" ">¿Necesitas ayuda con tu acceso?</a>
        </section>
    </main>

    <footer>
        <small> &copy; 2026 Pausa. Todos los derechos reservados. </small>
    </footer>

 </body>

 </html>
