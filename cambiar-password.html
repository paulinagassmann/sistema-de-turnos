<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Actualización obligatoria de contraseña temporal.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar contraseña - Pausa</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js?v=password-toggle-20261102" defer></script>
    <script src="js/profesional.js" defer></script>
</head>

<body class="pantalla-cambio-password">
    <header class="cabecera-cambio-password">
        <div class="bloque-marca">
            <span class="logo-texto">Pausa</span>
            <span class="subtitulo-logo">Acceso seguro</span>
        </div>
        <a href="index.html">Cerrar sesión</a>
    </header>

    <main>
        <section class="tarjeta-cambio-password" aria-labelledby="titulo-cambio-password">
            <h1 id="titulo-cambio-password">Elegí una nueva contraseña</h1>
            <p class="texto-intro-cambio">Por seguridad, al ser tu primer ingreso, debes actualizar tu contraseña temporal.</p>

            <form id="formulario-cambio-password" action="procesos/procesar-cambiar-password.php" method="POST">
                <div class="grupo-campo">
                    <label for="password-actual">Contraseña temporal actual</label>
                    <input type="password" id="password-actual" name="password_actual" autocomplete="current-password" data-password-toggle required>
                </div>

                <div class="grupo-campo">
                    <label for="password-nueva">Nueva contraseña</label>
                    <input type="password" id="password-nueva" name="password_nueva" autocomplete="new-password" minlength="8" aria-describedby="ayuda-password" data-password-toggle required>
                    <small id="ayuda-password">Debe tener al menos 8 caracteres.</small>
                </div>

                <div class="grupo-campo">
                    <label for="confirmar-password">Confirmar nueva contraseña</label>
                    <input type="password" id="confirmar-password" name="confirmar_password" autocomplete="new-password" minlength="8" data-password-toggle required>
                </div>

                <p id="mensaje-cambio-password" class="mensaje-cambio-password" role="alert" aria-live="polite" hidden></p>

                <button type="submit" class="btn-actualizar-password">Actualizar contraseña</button>
            </form>
        </section>
    </main>

    <footer>
        <small>&copy; 2026 Pausa. Todos los derechos reservados.</small>
    </footer>
</body>

</html>
