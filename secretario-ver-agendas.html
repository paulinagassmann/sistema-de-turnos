<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Permite consultar las agendas filtrando por profesional.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Agendas | Pausa - Secretario</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="body-dashboard">

    <div class="layout-secretario">
        
        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar-secretario">
            <div class="bloque-marca">
                <span class="logo-texto">Pausa</span>
                <span class="subtitulo-logo">Panel Secretario</span>
            </div>

            <!-- Botón principal de acción rápida (dar turno) -->
            <div class="bloque-accion-sidebar">
                <a href="secretario-dar-turno.html" class="btn-dar-turno">+ Dar turno</a>
            </div>

            <!-- Navegación lateral -->
            <nav class="menu-lateral">
                <a href="secretario.html" class="item-menu">
                    <span>Inicio / Hoy</span>
                </a>
                <a href="secretario-pacientes.html" class="item-menu">
                    <span>Pacientes</span>
                </a>
                <a href="secretario-agendas.html" class="item-menu">
                    <span>Agendas </span>
                </a>
                <a href="secretario-registrar-profesional.html" class="item-menu">
                    <span>Alta Profesional </span>
                </a>
                <a href="secretario-configuracion.html" class="item-menu">
                    <span>Configuración</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="index.html" class="btn-logout">
                    <span>Cerrar sesión</span>
                </a>
            </div>

        </aside>

        <main class="main-secretario vista-agendas">
            <header class="header-dashboard">
                <div class="texto-bienvenida-secretario">
                    <h1>Ver agendas</h1>
                    <p>Consultá la disponibilidad y los turnos de cada profesional.</p>
                </div>
            </header>

            <section class="tarjeta-blanca filtro-agendas" aria-label="Filtro de agendas">
                <label for="profesional-agenda">Profesional</label>
                <select id="profesional-agenda">
                    <option value="garabal">Lic. Garabal</option>
                    <option value="calvo">Lic. Calvo</option>
                    <option value="wiebe">Lic. Wiebe</option>
                </select>
            </section>

            <div class="grilla-consulta-agendas">
                <section class="tarjeta-blanca panel-calendario-agendas" aria-labelledby="titulo-calendario-agendas">
                    <div class="cabecera-mes">
                        <h2 id="titulo-calendario-agendas" aria-live="polite"></h2>
                        <div class="nav-mes">
                            <button type="button" class="btn-nav-mes" id="mes-anterior" aria-label="Mes anterior">&lt;</button>
                            <button type="button" class="btn-nav-mes" id="mes-siguiente" aria-label="Mes siguiente">&gt;</button>
                        </div>
                    </div>

                    <div class="dias-semana" aria-hidden="true">
                        <span>Dom</span>
                        <span>Lun</span>
                        <span>Mar</span>
                        <span>Mié</span>
                        <span>Jue</span>
                        <span>Vie</span>
                        <span>Sáb</span>
                    </div>
                    <div class="grilla-dias" id="dias-agenda" role="group" aria-label="Días del mes"></div>
                </section>

                <section class="tarjeta-blanca panel-horarios-agendas" aria-labelledby="fecha-agenda-seleccionada">
                    <div class="cabecera-horarios-dia">
                        <div>
                            <p class="sobrelinea-agendas">AGENDA DEL DÍA</p>
                            <h2 id="fecha-agenda-seleccionada" aria-live="polite"></h2>
                        </div>
                    </div>
                    <div class="lista-franjas-excepcion" id="horarios-agenda" aria-live="polite"></div>
                </section>
            </div>
        </main>
    </div>

    <footer>
        <small>&copy; 2026 Pausa. Todos los derechos reservados.</small>
    </footer>

    <script>
        const fechaCalendario = new Date();
        fechaCalendario.setDate(1);
        let fechaSeleccionada = new Date();

        const profesionales = {
            garabal: {
                nombre: 'Lic. Garabal',
                turnos: [
                    { hora: '09:00', paciente: null },
                    { hora: '10:00', paciente: { nombre: 'Enzo Murguía', dni: '44.123.456' } },
                    { hora: '11:00', paciente: null },
                    { hora: '12:00', paciente: { nombre: 'Julieta Romero', dni: '38.765.432' } },
                    { hora: '14:00', paciente: null }
                ]
            },
            calvo: {
                nombre: 'Lic. Calvo',
                turnos: [
                    { hora: '09:00', paciente: { nombre: 'Micaela Torres', dni: '41.234.567' } },
                    { hora: '10:00', paciente: null },
                    { hora: '11:00', paciente: { nombre: 'Bruno Acosta', dni: '39.876.543' } },
                    { hora: '12:00', paciente: null },
                    { hora: '14:00', paciente: null }
                ]
            },
            wiebe: {
                nombre: 'Lic. Wiebe',
                turnos: [
                    { hora: '09:00', paciente: null },
                    { hora: '10:00', paciente: { nombre: 'Sofía Benítez', dni: '42.345.678' } },
                    { hora: '11:00', paciente: null },
                    { hora: '12:00', paciente: { nombre: 'Tomás Fernández', dni: '40.987.654' } },
                    { hora: '14:00', paciente: null }
                ]
            }
        };

        const nombresMeses = new Intl.DateTimeFormat('es-AR', { month: 'long', year: 'numeric' });
        const formatoFecha = new Intl.DateTimeFormat('es-AR', {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });
        const selectorProfesional = document.getElementById('profesional-agenda');
        const grillaDias = document.getElementById('dias-agenda');
        const listaHorarios = document.getElementById('horarios-agenda');

        function renderizarHorarios() {
            const profesional = profesionales[selectorProfesional.value];
            const fechaTexto = formatoFecha.format(fechaSeleccionada);
            document.getElementById('fecha-agenda-seleccionada').textContent =
                `${fechaTexto.charAt(0).toLocaleUpperCase('es-AR')}${fechaTexto.slice(1)} · ${profesional.nombre}`;
            listaHorarios.replaceChildren();

            profesional.turnos.forEach((turno) => {
                const franja = document.createElement('div');
                franja.className = `item-franja-estado${turno.paciente ? ' franja-ocupada' : ''}`;

                const hora = document.createElement('span');
                hora.className = 'hora-franja';
                hora.textContent = turno.hora;

                const estado = document.createElement('span');
                estado.className = `badge-estado ${turno.paciente ? 'badge-ocupado' : 'badge-disponible'}`;
                estado.textContent = turno.paciente ? 'Ocupado' : 'Disponible';

                const detalle = document.createElement('span');
                detalle.className = 'detalle-estado';
                if (turno.paciente) {
                    detalle.textContent = turno.paciente.nombre;
                    const dni = document.createElement('small');
                    dni.textContent = `DNI: ${turno.paciente.dni}`;
                    detalle.append(dni);
                } else {
                    detalle.textContent = 'Horario libre';
                }

                franja.append(hora, estado, detalle);
                listaHorarios.append(franja);
            });
        }

        function renderizarCalendario() {
            const nombreMes = nombresMeses.format(fechaCalendario);
            document.getElementById('titulo-calendario-agendas').textContent =
                `${nombreMes.charAt(0).toLocaleUpperCase('es-AR')}${nombreMes.slice(1)}`;
            grillaDias.replaceChildren();

            const primerDiaSemana = new Date(
                fechaCalendario.getFullYear(),
                fechaCalendario.getMonth(),
                1
            ).getDay();
            const diasDelMes = new Date(
                fechaCalendario.getFullYear(),
                fechaCalendario.getMonth() + 1,
                0
            ).getDate();

            for (let espacio = 0; espacio < primerDiaSemana; espacio += 1) {
                const celdaVacia = document.createElement('span');
                celdaVacia.setAttribute('aria-hidden', 'true');
                grillaDias.append(celdaVacia);
            }

            for (let dia = 1; dia <= diasDelMes; dia += 1) {
                const botonDia = document.createElement('button');
                const fechaDia = new Date(
                    fechaCalendario.getFullYear(),
                    fechaCalendario.getMonth(),
                    dia
                );
                const seleccionado = fechaDia.toDateString() === fechaSeleccionada.toDateString();
                botonDia.type = 'button';
                botonDia.className = seleccionado ? 'dia-disponible dia-seleccionado' : 'dia-disponible';
                botonDia.textContent = String(dia);
                botonDia.setAttribute('aria-label', formatoFecha.format(fechaDia));
                botonDia.setAttribute('aria-pressed', String(seleccionado));
                botonDia.addEventListener('click', () => {
                    fechaSeleccionada = fechaDia;
                    renderizarCalendario();
                    renderizarHorarios();
                });
                grillaDias.append(botonDia);
            }
        }

        function cambiarMes(cambio) {
            const diaDelMes = fechaSeleccionada.getDate();
            fechaCalendario.setMonth(fechaCalendario.getMonth() + cambio);
            const ultimoDiaMes = new Date(
                fechaCalendario.getFullYear(),
                fechaCalendario.getMonth() + 1,
                0
            ).getDate();
            fechaSeleccionada = new Date(
                fechaCalendario.getFullYear(),
                fechaCalendario.getMonth(),
                Math.min(diaDelMes, ultimoDiaMes)
            );
            renderizarCalendario();
            renderizarHorarios();
        }

        document.getElementById('mes-anterior').addEventListener('click', () => cambiarMes(-1));
        document.getElementById('mes-siguiente').addEventListener('click', () => cambiarMes(1));
        selectorProfesional.addEventListener('change', renderizarHorarios);

        renderizarCalendario();
        renderizarHorarios();
    </script>

</body>
</html>
