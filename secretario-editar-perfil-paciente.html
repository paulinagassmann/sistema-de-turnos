<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Vista de secretario para editar el perfil de un paciente.">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
    <title> Pausa - Secretario </title>
    <link rel="stylesheet" href="styles.css"> <!-- Enlaza el archivo styles.css para agregar estilos -->
</head>

<body class="body-dashboard">

    <div class="layout-secretario">
        
        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar-secretario">
            <div class="bloque-marca">
                <span class="logo-texto">Pausa</span>
                <span class="subtitulo-logo">Panel Secretario</span>
            </div>

            <!-- Botón principal de acción rápida (dar turno) -->
            <div class="bloque-accion-sidebar">
                <a href="secretario-dar-turno.html" class="btn-dar-turno">+ Dar turno</a>
            </div>

            <!-- Navegación lateral -->
            <nav class="menu-lateral">
                <a href="secretario.html" class="item-menu">
                    <span>Inicio / Hoy</span>
                </a>
                <a href="secretario-pacientes.html" class="item-menu">
                    <span>Pacientes</span>
                </a>
                <a href="secretario-agendas.html" class="item-menu">
                    <span>Agendas </span>
                </a>
                <a href="secretario-registrar-profesional.html" class="item-menu">
                    <span>Alta Profesional </span>
                </a>
                <a href="secretario-configuracion.html" class="item-menu">
                    <span>Configuración</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="index.html" class="btn-logout">
                    <span>Cerrar sesión</span>
                </a>
            </div>

        </aside>

        <main class="main-secretario">

            <header class="header-dashboard">
                <div class="texto-bienvenida-secretario">
                    <h1>Editar perfil del paciente</h1>
                </div>
            </header>

            <div class="grilla-perfil">

                <!-- TARJETA 1: CAMBIAR CORREO / USUARIO -->
                <section class="tarjeta-blanca">
                    
                    <form class="form-perfil">

                        <h2> Teléfono </h2>
                        <div class="grupo-campo">
                            <label for="telefono-actual">Teléfono actual</label>
                            <input type="text" id="telefono-actual" value="123456789" class="input-form">
                        </div>

                        <h2> Correo electrónico </h2>
                        <div class="grupo-campo">
                            <label for="correo-actual">Correo actual</label>
                            <input type="email" id="correo-actual" value="enzo.murguia@example.com" class="input-form">
                        </div>

                        <div class="footer-pasos">
                            <button type="button" class="btn-siguiente-paso">Actualizar </button>
                        </div>

                    </form>

                </section>

            </div>

        </main>
    </div>

    <footer>
        <small> &copy; 2026 Pausa. Todos los derechos reservados. </small>
    </footer>

</body>
</html>
